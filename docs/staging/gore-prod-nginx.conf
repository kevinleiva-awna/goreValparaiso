# /etc/nginx/sites-available/gore.conf  —  PRODUCCIÓN (i-099343b5b7dffc94f)
# TLS: Let's Encrypt para www.participa.gobiernovalparaiso.cl + apex.
# Canónico: www ; el apex y todo HTTP redirigen a https://www.
# Esta copia es la fuente de verdad versionada; el server puede reconstruirse desde aquí.

# ---- HTTP :80 — ACME (emisión/renovación) + redirect a HTTPS canónico ----
server {
    listen 80 default_server;
    server_name www.participa.gobiernovalparaiso.cl participa.gobiernovalparaiso.cl _;

    # Let's Encrypt HTTP-01: debe seguir accesible por :80 para las renovaciones.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gore/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://www.participa.gobiernovalparaiso.cl$request_uri;
    }
}

# ---- HTTPS :443 apex — redirect a www ----
server {
    listen 443 ssl http2;
    server_name participa.gobiernovalparaiso.cl;

    ssl_certificate     /etc/letsencrypt/live/www.participa.gobiernovalparaiso.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.participa.gobiernovalparaiso.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://www.participa.gobiernovalparaiso.cl$request_uri;
}

# ---- HTTPS :443 www — app canónica ----
server {
    listen 443 ssl http2;
    server_name www.participa.gobiernovalparaiso.cl;

    ssl_certificate     /etc/letsencrypt/live/www.participa.gobiernovalparaiso.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.participa.gobiernovalparaiso.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS lo emite la app (middleware Laravel) con includeSubDomains; no duplicar aquí.

    root /var/www/gore/public;
    index index.php;
    client_max_body_size 110M;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 180s;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
