# /etc/nginx/sites-available/gore.conf  —  STAGING (i-044e3f43201359d9a)
# TLS: Let's Encrypt para pruebas.participa.gobiernovalparaiso.cl
# Emitido el 27-ago-2026 por webroot (HTTP-01, /var/www/gore/public).
#
# El dominio existe porque ClaveUnica NO acepta direcciones IP en los
# redirect/logout URI: para poder probar el par de credenciales de sandbox,
# staging tenia que responder por un nombre y con HTTPS.
#
# Esta copia es la fuente de verdad versionada; el server puede reconstruirse
# desde aqui. Espejo de docs/staging/gore-prod-nginx.conf, sin el bloque de
# apex (staging tiene un solo nombre).

# ---- HTTP :80 — ACME (emision/renovacion) + redirect a HTTPS ----
server {
    listen 80 default_server;
    server_name pruebas.participa.gobiernovalparaiso.cl _;

    # Let's Encrypt HTTP-01: debe seguir accesible por :80 para las renovaciones.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gore/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Incluye los accesos por IP cruda (3.227.228.33), que quedan redirigidos
    # al nombre. La IP ya no es una via de acceso valida a staging.
    location / {
        return 301 https://pruebas.participa.gobiernovalparaiso.cl$request_uri;
    }
}

# ---- HTTPS :443 — app ----
server {
    listen 443 ssl http2 default_server;
    server_name pruebas.participa.gobiernovalparaiso.cl;

    ssl_certificate     /etc/letsencrypt/live/pruebas.participa.gobiernovalparaiso.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pruebas.participa.gobiernovalparaiso.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS lo emite la app (middleware Laravel); no duplicar aqui.

    root /var/www/gore/public;
    index index.php;
    client_max_body_size 110M;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 180s;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
